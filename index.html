<style>
  :root{
    --bg:#f6f3ec; --card:#fffdf8; --ink:#2b2118; --muted:#71614d;
    --line:#e2d8c8; --accent:#8a5a2b; --accent-soft:#f0e4d3; --shadow:0 1px 3px rgba(80,60,30,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14110d; --card:#1f1b16; --ink:#efe6d8; --muted:#a8977f;
           --line:#332c23; --accent:#d9a86a; --accent-soft:#2c2318; --shadow:none; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;line-height:1.6}
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
  header{text-align:center;padding:26px 0 18px}
  header h1{margin:0;font-size:2rem;letter-spacing:.5px}
  header p{margin:6px 0 0;color:var(--muted);font-size:.95rem}
  nav.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
             margin:0 0 18px;font-size:.95rem;color:var(--muted);min-height:26px}
  nav.crumbs a{color:var(--accent);text-decoration:none;cursor:pointer}
  nav.crumbs a:hover{text-decoration:underline}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px 18px;cursor:pointer;box-shadow:var(--shadow);
        transition:transform .12s ease,border-color .12s ease;text-align:right}
  .tile:hover{transform:translateY(-2px);border-color:var(--accent)}
  .tile h3{margin:0;font-size:1.15rem}
  .tile .sub{color:var(--muted);font-size:.85rem;margin-top:4px}
  .tile.off{opacity:.5;cursor:default}
  .tile.off:hover{transform:none;border-color:var(--line)}
  .badge{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;
         background:var(--accent-soft);color:var(--accent);margin-top:8px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;
         padding:24px;box-shadow:var(--shadow)}
  .panel h2{margin:0 0 4px;font-size:1.6rem}
  .panel .meta{color:var(--muted);margin-bottom:18px}
  .btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
       padding:11px 20px;border-radius:10px;font-size:1rem;font-weight:600}
  .btn:hover{filter:brightness(1.08)}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:10px;
        min-width:52px;text-align:center;padding:9px 12px;cursor:pointer;
        box-shadow:var(--shadow);font-size:1.02rem}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip small{display:block;color:var(--muted);font-size:.7rem;line-height:1.3}
  .chip.dead{opacity:.45;cursor:not-allowed}
  .chip.dead:hover{border-color:var(--line);color:var(--ink)}
  .note{margin-top:20px;padding:12px 14px;border-radius:10px;
        background:var(--accent-soft);color:var(--accent);font-size:.9rem}
  .sec{margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}
  .sec h4{margin:0 0 10px;font-size:.95rem;color:var(--muted);font-weight:600}
  .dedication{text-align:center;margin:4px 0 22px;font-size:1rem;color:var(--accent);
              letter-spacing:.3px}
  footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:40px;line-height:2}
  .wa{display:inline-flex;align-items:center;gap:7px;background:#25D366;color:#fff;
      text-decoration:none;padding:9px 16px;border-radius:999px;font-size:.9rem;
      font-weight:600;margin-top:6px}
  .wa:hover{filter:brightness(1.07)}

  /* --- לימוד היום, נגן מוטמע, זיכרון מקום --- */
  .hero{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
  .hero .btn{flex:1 1 auto;text-align:center;cursor:pointer;border:1px solid var(--accent)}
  .hero .btn.ghost{background:transparent;color:var(--accent)}
  .daynav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .daynav button{background:var(--card);color:var(--accent);border:1px solid var(--line);
        border-radius:10px;padding:7px 14px;font-size:1rem;cursor:pointer;font-family:inherit}
  .daynav button:hover:not(:disabled){border-color:var(--accent)}
  .daynav button:disabled{opacity:.35;cursor:default}
  .daynav .lbl{font-weight:600;text-align:center;flex:1}
  .daynav .lbl small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
  .lesson{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
  .lesson:first-of-type{margin-top:0;padding-top:0;border-top:0}
  .lesson h3{margin:0 0 2px;font-size:1.12rem}
  .lesson .rng{color:var(--muted);font-size:.9rem;margin-bottom:10px}
  .player{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;
        background:#000;border:1px solid var(--line)}
  .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px;align-items:center}
  .act{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 14px;
        cursor:pointer;font-size:.9rem;color:var(--ink);text-decoration:none;font-family:inherit}
  .act:hover{border-color:var(--accent);color:var(--accent)}
  .act.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .chip.seen{border-color:var(--accent);background:var(--accent-soft)}
  .chip .tick{color:var(--accent);font-size:.72rem}
  .empty{padding:26px;text-align:center;color:var(--muted);
        border:1px dashed var(--line);border-radius:12px}
  .catchup{background:var(--accent-soft);border:1px solid var(--accent);
        border-radius:10px;padding:12px 15px;margin-bottom:14px;font-size:.92rem}
  .catchup button{margin-inline-start:10px;background:var(--accent);color:#fff;
        border:0;border-radius:8px;padding:7px 14px;font-size:.88rem;cursor:pointer;
        font-family:inherit}
  .doneday{color:var(--accent);font-weight:600;font-size:.92rem;margin-bottom:12px}
  .setrow{margin:20px 0;padding-top:16px;border-top:1px dashed var(--line)}
  .setrow label{display:block;font-weight:600;margin-bottom:8px}
  .setrow p{margin:8px 0 0;color:var(--muted);font-size:.86rem;line-height:1.55}
  .setrow select{font-family:inherit;font-size:1rem;padding:9px 12px;
        border:1px solid var(--line);border-radius:9px;background:var(--card);
        color:var(--ink);min-width:120px}
  .stepper{display:flex;align-items:center;gap:8px}
  .stepper button{width:46px;height:46px;font-size:1.4rem;line-height:1;
        border:1px solid var(--line);border-radius:9px;background:var(--card);
        color:var(--accent);cursor:pointer;font-family:inherit}
  .stepper button:hover{border-color:var(--accent)}
  .stepper input{width:86px;height:46px;text-align:center;font-size:1.05rem;
        font-family:inherit;border:1px solid var(--line);border-radius:9px;
        background:var(--card);color:var(--ink)}
  .preview{margin-top:20px;padding:13px 15px;border-radius:10px;
        background:var(--accent-soft);color:var(--accent);font-size:.93rem}
  .preview span{color:var(--accent);opacity:.85;font-size:.86rem}
  .mylink{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .mylink code{flex:1 1 220px;background:var(--accent-soft);color:var(--accent);
        padding:10px 12px;border-radius:9px;font-size:.82rem;direction:ltr;
        text-align:left;word-break:break-all;line-height:1.5}
  @media (max-width:520px){
    header{padding:16px 0 10px}
    header h1{font-size:1.55rem}
    header p{display:none}
    .dedication{margin:2px 0 14px;font-size:.95rem}
    .wrap{padding:12px 14px 50px}
  }
  .audio{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
  .audio iframe{display:block;width:100%;height:78px;border:0}
  .listenbox:not(:empty){margin-top:11px}
  .srcnote{font-size:.78rem;color:var(--muted);margin-top:7px}
  /* נגן אודיו עצמאי */
  .ap{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px}
  .ap audio{width:100%;display:block}
  .ap .ctl{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:9px}
  .ap .ctl button,.ap .ctl select{background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);
        border-radius:9px;padding:7px 12px;font-size:.92rem;cursor:pointer;font-family:inherit}
  .ap .ctl label{font-size:.85rem;color:var(--muted);display:flex;gap:5px;align-items:center;margin-inline-start:auto}
  .ap iframe{display:block;width:100%;height:78px;border:0}
  /* טקסט המשנה */
  .mtext{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:6px 16px 12px}
  .mtext .tbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:6px 0;
        border-bottom:1px dashed var(--line);margin-bottom:6px}
  .mtext .tbar b{flex:1;color:var(--accent);font-size:.92rem}
  .mtext .tbar button{background:transparent;border:1px solid var(--line);border-radius:8px;
        padding:4px 10px;cursor:pointer;color:var(--ink);font-family:inherit;font-size:.85rem}
  .mtext .mh{font-weight:700;color:var(--accent);margin:12px 0 2px;font-size:.9rem}
  .mtext .mb{font-family:"David","Frank Ruehl CLM","Times New Roman",serif;
        font-size:calc(1.18rem * var(--mfs,1));line-height:1.85}
  .mtext.closed .body{display:none}
  .mtext .tbar button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .mtext .bart{margin:6px 0 4px;padding:4px 12px;border-inline-start:3px solid var(--accent-soft);
        color:var(--muted);font-family:"David","Frank Ruehl CLM","Times New Roman",serif;
        font-size:calc(1rem * var(--mfs,1));line-height:1.7}
  .mtext .bart p{margin:5px 0}
  .mtext .bart b{color:var(--ink)}
  .prog{height:8px;border-radius:9px;background:var(--accent-soft);overflow:hidden;margin:8px 0 4px}
  .prog i{display:block;height:100%;background:var(--accent)}
  .search{display:flex;gap:8px;margin:0 0 12px}
  .search input{flex:1;font-family:inherit;font-size:1rem;padding:9px 12px;border:1px solid var(--line);
        border-radius:10px;background:var(--card);color:var(--ink)}
  .search .err{color:var(--muted);font-size:.85rem;align-self:center}
</style>

/* מספר הסרטון (מ-1) שמכיל את המשנה ה-j במסכת.
   סופרים ברצף בתוך הסדר בקבוצות של 3; off = כמה משניות קדמו בסדר. */
function videoOf(m, j){
  const g  = Math.ceil((m.off + j) / 3);
  const g0 = Math.ceil((m.off + 1) / 3);
  return g - g0 + 1;
}
const flatIndex = (m, c, i) => m.ch.slice(0, c - 1).reduce((a,b)=>a+b, 0) + i;
const total = m => m.ch.reduce((a,b)=>a+b, 0);

/* ================= לוח הלימוד היומי =================
   יום לימוד = שלוש משניות ברצף. שישה ימים בשבוע, מדלגים על שבת.
   הלוח נבנה מאותם נתונים של האתר, כדי שלא יהיה מספר כפול שיסתור את עצמו. */

/* ברירות מחדל. המשתמש יכול לשנות אותן במסך ההגדרות, והן נשמרות במכשיר שלו. */
const ROLLOVER_DEFAULT = 19;   /* היום הלימודי מתחלף בערב, כמו במוצאי שבת */
const OFFSET_MAX = 120;        /* גבול ההקדמה/איחור, בימי לימוד */

function prefs(){
  const p = (memRead().prefs) || {};
  let r = parseInt(p.rollover, 10);
  if (!(r >= 0 && r <= 23)) r = ROLLOVER_DEFAULT;
  let o = parseInt(p.offset, 10);
  if (!Number.isInteger(o)) o = 0;
  o = Math.max(-OFFSET_MAX, Math.min(OFFSET_MAX, o));
  return {rollover: r, offset: o};
}
function setPrefs(patch){
  const o = memRead();
  o.prefs = Object.assign({}, o.prefs || {}, patch);
  memWrite(o);
}
const SKIP = new Set(CAL.skip || []);   /* ימים טובים - לא לומדים */

const iso = d => d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");

/* יום לימוד = לא שבת ולא יום טוב */
const isLearnDay = d => d.getDay() !== 6 && !SKIP.has(iso(d));
const DAYNAMES = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];

function buildDays(){
  const days = [];
  SEDARIM.forEach((s, si) => {
    let prevEnd = null, prevG1 = null;
    s.m.forEach((m, mi) => {
      const learned = total(m);
      if (!learned) return;
      const g0 = Math.ceil((m.off + 1) / 3), g1 = Math.ceil((m.off + learned) / 3);
      const cont = prevEnd !== null && m.off === prevEnd;
      for (let gi = 0; gi <= g1 - g0; gi++){
        if (gi === 0 && cont && g0 === prevG1) days[days.length - 1].push([si, mi, 1]);
        else days.push([[si, mi, gi + 1]]);
      }
      prevEnd = m.off + learned; prevG1 = g1;
    });
  });
  return days;
}
const DAYS = buildDays();

const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());

/* כמה ימי לימוד יש בטווח [a,b) - בלי שבתות ובלי ימים טובים */
function learnSpan(a, b){
  const d = midnight(a), e = midnight(b);
  let c = 0;
  while (d < e){
    if (isLearnDay(d)) c++;
    d.setDate(d.getDate() + 1);
  }
  return c;
}

/* התאריך שאליו מתייחס "היום", אחרי שהיום הלימודי מתחלף בערב */
/* שעת ההחלפה יכולה להיות בערב או בבוקר, וזה שני דברים שונים:
   19:00 = היום הלימודי מתחיל בערב, כמו במוצאי שבת, ולכן שייך למחרת.
   05:00 = היום הלימודי מתחיל בבוקר, ולכן לפני 05:00 עדיין אתמול.
   שתיהן נופלות מאותה נוסחה: מזיזים אחורה את שעת הסף,
   ומוסיפים יום רק כשהסף הוא ערב. */
function learningDate(){
  const h = prefs().rollover;
  const t = new Date(Date.now() - h * 3600000);
  const d = midnight(t);
  if (h >= 12) d.setDate(d.getDate() + 1);
  return d;
}

/* היום שהמשתמש נמצא בו בפועל, אחרי הקדמה או איחור שבחר */
function currentDayIndex(){
  const i = dayIndexFor(learningDate()) + prefs().offset;
  return Math.max(0, Math.min(DAYS.length - 1, i));
}

/* אינדקס יום הלימוד עבור תאריך. שבת מצביעה ממילא על השיעור הבא. */
function dayIndexFor(date){
  const anc = new Date(CAL.d + "T00:00:00");
  const d = midnight(date);
  return d >= anc ? CAL.i + learnSpan(anc, d) : CAL.i - learnSpan(d, anc);
}

/* התאריך של יום לימוד לפי אינדקס */
function dateOfDay(idx){
  const d = new Date(CAL.d + "T00:00:00");
  const n = idx - CAL.i, s = n < 0 ? -1 : 1;
  for (let k = 0; k < Math.abs(n); k++){
    do { d.setDate(d.getDate() + s); } while (!isLearnDay(d));
  }
  return d;
}

/* טווח המשניות שבשיעור L של מסכת m, כאינדקסים בתוך המסכת */
function lessonRange(m, L){
  const g = Math.ceil((m.off + 1) / 3) + L - 1;
  return [Math.max(3 * g - 2, m.off + 1) - m.off,
          Math.min(3 * g, m.off + total(m)) - m.off];
}

/* משנה מספר j במסכת -> [פרק, משנה] */
function locate(m, j){
  for (let c = 0; c < m.ch.length; c++){
    if (j <= m.ch[c]) return [c + 1, j];
    j -= m.ch[c];
  }
  return [m.ch.length, j];
}

/* תיאור מילולי של מה נלמד בשיעור */
function lessonLabel(m, L){
  const r = lessonRange(m, L);
  const p = locate(m, r[0]), q = locate(m, r[1]);
  const one = x => "פרק " + heb(x[0]) + " משנה " + heb(x[1]);
  if (r[0] === r[1]) return one(p);
  if (p[0] === q[0]) return "פרק " + heb(p[0]) + ", משניות " + heb(p[1]) + "-" + heb(q[1]);
  return one(p) + " עד " + one(q);
}

const seenKey = (si, mi, L) => si + "." + mi + "." + L;
function isSeen(si, mi, L){ return !!(memRead().done || {})[seenKey(si, mi, L)]; }
function toggleSeen(si, mi, L){
  const o = memRead(); o.done = o.done || {};

function posGet(id){ return ((memRead().pos) || {})[id] || 0; }
function posSet(id, t){ const o = memRead(); o.pos = o.pos || {};
  if (t) o.pos[id] = t; else delete o.pos[id]; memWrite(o); }

function wireAudio(box){
  const id = box.dataset.id, au = box.querySelector("audio");
  const pr = memRead().prefs || {};
  const spd = box.querySelector(".spd");
  spd.value = String(pr.speed || 1);
  let k = 0, stall = null, saved = 0;
  const fallback = () => {
    box.innerHTML = '<iframe src="https://drive.google.com/file/d/' + id +
      '/preview" allow="autoplay"></iframe>';
  };
  const load = () => {
    clearTimeout(stall);
    if (k >= SRCS.length) return fallback();
    au.src = SRCS[k](id);
    stall = setTimeout(() => { if (au.readyState === 0){ k++; load(); } }, 7000);
  };
  au.onerror = () => { k++; load(); };
  au.onloadedmetadata = () => {
    clearTimeout(stall);
    au.playbackRate = +spd.value;
    const p = posGet(id); if (p && p < au.duration - 5) au.currentTime = p;
    if (AUTOPLAY){ AUTOPLAY = false; au.play().catch(() => {}); }
  };
  au.ontimeupdate = () => {
    if (Date.now() - saved < 5000) return;
    saved = Date.now(); posSet(id, Math.floor(au.currentTime));
  };
  spd.onchange = () => { au.playbackRate = +spd.value; setPrefs({speed: +spd.value}); };
  box.querySelectorAll("button[data-sk]").forEach(b => b.onclick = () => {
    au.currentTime = Math.max(0, au.currentTime + +b.dataset.sk);
  });
  const an = box.querySelector(".auton");
  if (an){ an.checked = pr.autonext !== false;
           an.onchange = () => setPrefs({autonext: an.checked}); }
  au.onended = () => {
    posSet(id, 0);
    const key = box.dataset.k; if (!key) return;
    const [si, mi, L] = key.split(".").map(Number);
    if (!isSeen(si, mi, L)) toggleSeen(si, mi, L);
    const b = app.querySelector('button.mark[data-k="' + key + '"]');
    if (b){ b.classList.add("on"); b.textContent = "✓ נלמד"; }
    if ((memRead().prefs || {}).autonext === false) return;
    const nx = nextLesson(si, mi, L);
    if (nx){ AUTOPLAY = true; viewLesson(nx[0], nx[1], nx[2]); }
  };
  load();
}

/* השיעור הבא לפי סדר המשנה (גם מעבר מסכת וסדר) */
function lessonCount(m){ return Math.max((m.v || []).length, (m.a || []).length); }
function nextLesson(si, mi, L){
  for (;;){
    const m = SEDARIM[si].m[mi];
    if (L < lessonCount(m)) return [si, mi, L + 1];
    L = 0; mi++;
    if (mi >= SEDARIM[si].m.length){ mi = 0; si++; if (si >= SEDARIM.length) return null; }
  }
}

 "ערכין":"Arakhin","תמורה":"Temurah","כריתות":"Keritot","מעילה":"Meilah","תמיד":"Tamid","מדות":"Middot",
 "קינים":"Kinnim","כלים":"Kelim","אהלות":"Oholot","נגעים":"Negaim","פרה":"Parah","טהרות":"Tahorot",
 "מקוואות":"Mikvaot","נדה":"Niddah","מכשירין":"Makhshirin","זבים":"Zavim","טבול יום":"Tevul_Yom",
 "ידים":"Yadayim","עקצים":"Oktzin"};
const slugOf = n => SLUG[n] ? (n === "אבות" ? SLUG[n] : "Mishnah_" + SLUG[n]) : null;
const CH_CACHE = {};
async function chapterText(slug, c){
  const key = slug + "." + c;
  if (!CH_CACHE[key]) CH_CACHE[key] = fetch("https://www.sefaria.org/api/v3/texts/" + key + "?version=hebrew")
    .then(r => r.json()).then(j => (j.versions && j.versions[0] && j.versions[0].text) || []);
  return CH_CACHE[key];
}
const stripNik = s => s.replace(/[֑-ֽֿ-ׇ]/g, "");
const cleanTxt = s => String(s).replace(/<[^>]+>/g, "");
/* ברטנורא: שומרים רק את ההדגשה של הדיבור המתחיל */
const cleanBart = s => String(s).replace(/<(?!\/?b>)[^>]+>/g, "");
const bartSlug = slug => "Bartenura_on_" + slug;

function textBlock(si, mi, L){
  const m = SEDARIM[si].m[mi];
  if (m.u || !slugOf(m.n)) return "";
  const pr = memRead().prefs || {};
  return '<div class="mtext' + (pr.textOpen === false ? ' closed' : '') + '" data-k="' + si + '.' + mi + '.' + L + '">' +
    '<div class="tbar"><b>📜 טקסט המשניות</b>' +
    '<button data-t="nik">' + (pr.nikud === false ? 'עם ניקוד' : 'בלי ניקוד') + '</button>' +
    '<button data-t="bart"' + (pr.bart ? ' class="on"' : '') + '>ברטנורא</button>' +
    '<button data-t="big">א+</button><button data-t="small">א-</button>' +
    '<button data-t="tog">' + (pr.textOpen === false ? 'הצג' : 'הסתר') + '</button></div>' +
    '<div class="body">טוען…</div></div>';
}

async function fillText(box){
  const [si, mi, L] = box.dataset.k.split(".").map(Number);
  const m = SEDARIM[si].m[mi], slug = slugOf(m.n);
  const r = lessonRange(m, L), body = box.querySelector(".body");
  const pr = memRead().prefs || {}, nik = pr.nikud !== false, bart = !!pr.bart;
  const nk = t => nik ? t : stripNik(t);
  try {
    let html = "";
    for (let j = r[0]; j <= r[1]; j++){
      const [c, n] = locate(m, j);
      const t = (await chapterText(slug, c))[n - 1];
      html += '<div class="mh">פרק ' + heb(c) + ' משנה ' + heb(n) + '</div>' +
        '<div class="mb">' + (t ? nk(cleanTxt(t)) : '<i>לא נמצא בספריא</i>') + '</div>';
      if (bart){
        let b = [];
        try { b = (await chapterText(bartSlug(slug), c))[n - 1] || []; } catch (e) {}
        if (!Array.isArray(b)) b = [b];
        html += '<div class="bart">' + (b.length ? b.map(x => '<p>' + nk(cleanBart(x)) + '</p>').join('')
                 : '<p><i>אין ברטנורא למשנה זו בספריא</i></p>') + '</div>';
      }
    }
    const [c0, n0] = locate(m, r[0]);
    html += '<div class="srcnote">הטקסט מתוך <a href="https://www.sefaria.org/' + slug + '.' + c0 + '.' + n0 +
            '?lang=he" target="_blank" rel="noopener">ספריא</a>, עם פירושים.</div>';
    body.innerHTML = html;
  } catch (e) {
    body.textContent = "לא הצלחתי לטעון את הטקסט (צריך חיבור לאינטרנט).";
  }
}

function applyFont(){
  document.documentElement.style.setProperty("--mfs", (memRead().prefs || {}).fs || 1);
}

function wireText(box){
  fillText(box);
  box.querySelectorAll("button[data-t]").forEach(b => b.onclick = () => {
    const pr = memRead().prefs || {}, t = b.dataset.t;
    if (t === "nik"){ setPrefs({nikud: pr.nikud === false});
      app.querySelectorAll(".mtext").forEach(x => { x.querySelector('[data-t="nik"]').textContent =
        pr.nikud === false ? "בלי ניקוד" : "עם ניקוד"; fillText(x); }); }
    if (t === "bart"){ setPrefs({bart: !pr.bart});
      app.querySelectorAll(".mtext").forEach(x => { x.querySelector('[data-t="bart"]').classList.toggle("on", !pr.bart);
        fillText(x); }); }
    if (t === "big" || t === "small"){
      const fs = Math.max(0.8, Math.min(2, (pr.fs || 1) + (t === "big" ? 0.1 : -0.1)));
      setPrefs({fs: Math.round(fs * 10) / 10}); applyFont(); }
    if (t === "tog"){ const open = box.classList.toggle("closed") === false;
      setPrefs({textOpen: open});
      app.querySelectorAll(".mtext").forEach(x => { x.classList.toggle("closed", !open);
        x.querySelector('[data-t="tog"]').textContent = open ? "הסתר" : "הצג"; }); }
  });
}

/* ================= חיפוש "מסכת פרק משנה" ================= */
const GEM = {"א":1,"ב":2,"ג":3,"ד":4,"ה":5,"ו":6,"ז":7,"ח":8,"ט":9,"י":10,"כ":20,"ך":20,"ל":30,"מ":40};
function numOf(s){
  s = s.replace(/["'׳״]/g, "");
  if (/^\d+$/.test(s)) return +s;
  let n = 0; for (const ch of s){ if (!GEM[ch]) return NaN; n += GEM[ch]; }
  return n || NaN;
}
function doSearch(q){
  const qe = document.getElementById("qerr");
  q = q.trim().replace(/^(מסכת|משנה)\s+/, "").replace(/\s+/g, " ");
  if (!q) return;
  const all = [];
  SEDARIM.forEach((s, si) => s.m.forEach((m, mi) => all.push([si, mi, m])));
  /* השם הארוך ביותר שמתאים לתחילת החיפוש (בבא קמא לפני בבא) */
  const hit = all.filter(x => q === x[2].n || q.startsWith(x[2].n + " "))
                 .sort((a, b) => b[2].n.length - a[2].n.length)[0]
           || all.find(x => x[2].n.startsWith(q.split(" ")[0]));
  if (!hit){ qe.textContent = "לא מצאתי מסכת בשם הזה"; return; }
  const [si, mi, m] = hit;
  const rest = q.slice(q.startsWith(m.n) ? m.n.length : q.split(" ")[0].length)
                .trim().replace(/^פרק\s*/, "").split(/[\s,:.]+/).filter(x => x && x !== "משנה");
  const c = numOf(rest[0] || ""), n = numOf(rest[1] || "") || 1;
  qe.textContent = "";
  if (!c) return viewMasechet(si, mi);
  if (!m.ch[c - 1] || n > m.ch[c - 1]){ qe.textContent = "אין משנה כזו במסכת " + m.n; return; }
  let j = n; for (let i = 0; i < c - 1; i++) j += m.ch[i];
  for (let L = 1; L <= lessonCount(m) + 1; L++){
    const r = lessonRange(m, L);
    if (j >= r[0] && j <= r[1]) return viewLesson(si, mi, L);
  }
  viewChapter(si, mi, c);
}

function playerBlock(si, mi, L){
  const m = SEDARIM[si].m[mi];
  const vid = (m.v || [])[L - 1];
  const aud = (m.a || [])[L - 1];
  const label = m.n + " שיעור " + L;
  const head = "<h3>" + m.n + " · שיעור " + L + "</h3>" +
               '<div class="rng">' + lessonLabel(m, L) + "</div>";
  const txt = textBlock(si, mi, L);
  if (!vid && !aud) return '<div class="lesson">' + head +
      '<div class="empty">השיעור הזה עדיין לא הוקלט.</div>' + txt + '</div>';

  const seen = isSeen(si, mi, L);
  const mark = '<button class="act mark' + (seen ? ' on' : '') +
        '" data-k="' + si + '.' + mi + '.' + L + '">' +
        (seen ? '✓ נלמד' : 'סמן כנלמד') + '</button>';
  const toMas = '<a class="act" data-go="' + si + '.' + mi + '">למסכת ' + m.n + '</a>';
  const share = '<button class="act" data-share="' + si + '.' + mi + '.' + L + '">שיתוף</button>';

  if (vid){
    return '<div class="lesson">' + head +
      '<div class="player"><iframe src="https://www.youtube-nocookie.com/embed/' + vid + '?rel=0"' +
      ' title="' + label + '" loading="lazy"' +
      ' allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"' +
      ' referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>' +
      '<div class="acts">' + mark + share +
        '<a class="act" href="https://www.youtube.com/watch?v=' + vid + '&list=' + m.p + '"' +
          ' target="_blank" rel="noopener">פתח ביוטיוב</a>' +
        (aud ? '<button class="act" data-listen="' + aud + '" data-k="' + si + '.' + mi + '.' + L +
               '">🎧 האזנה</button>' : '') +
        toMas +
      '</div><div class="listenbox"></div>' + txt + '</div>';
  }

  return '<div class="lesson">' + head + audioFrame(aud, label, si + '.' + mi + '.' + L) +
    '<div class="srcnote">הקלטת אודיו. השיעור עוד לא נערך לווידאו.</div>' +
    '<div class="acts">' + mark + share +
      '<a class="act" href="https://drive.google.com/file/d/' + aud + '/view"' +
        ' target="_blank" rel="noopener">פתיחה בדרייב</a>' +
      toMas +
    '</div>' + txt + '</div>';
}

function wirePlayers(){
  app.querySelectorAll("button[data-listen]").forEach(b => b.onclick = () => {
    const box = b.closest(".lesson").querySelector(".listenbox");
    if (box.innerHTML){ box.innerHTML = ""; b.classList.remove("on"); return; }
    box.innerHTML = audioFrame(b.dataset.listen, "האזנה", b.dataset.k);
    b.classList.add("on"); AUTOPLAY = true;
    wireAudio(box.querySelector(".ap"));
  });
  setTimeout(() => {   /* המשך אוטומטי ממצב האזנה: פותח את ההאזנה גם בשיעור הבא */
    if (!AUTOPLAY) return;
    const b = app.querySelector("button[data-listen]");
    if (b && !app.querySelector(".ap")) b.click(); else if (!app.querySelector(".ap")) AUTOPLAY = false;
  }, 0);
  app.querySelectorAll(".ap").forEach(wireAudio);
  app.querySelectorAll(".mtext").forEach(wireText);
  app.querySelectorAll("button.mark").forEach(b => b.onclick = () => {
    const k = b.dataset.k.split(".").map(Number);
    const on = toggleSeen(k[0], k[1], k[2]);
    b.classList.toggle("on", on);
    b.textContent = on ? "✓ נלמד" : "סמן כנלמד";
  });
  app.querySelectorAll("a.act[data-go]").forEach(a => a.onclick = () => {
    const k = a.dataset.go.split(".").map(Number);
    viewMasechet(k[0], k[1]);
  });
  app.querySelectorAll("button.act[data-share]").forEach(b => b.onclick = async () => {
    const k = b.dataset.share.split(".").map(Number);
    const m = SEDARIM[k[0]].m[k[1]];
    const url = location.origin + location.pathname + "#/l/" + k[0] + "/" + k[1] + "/" + k[2];
    const text = "משנה יומית · " + m.n + " שיעור " + k[2] + " — " + lessonLabel(m, k[2]);
    try {
      if (navigator.share) { await navigator.share({title: "משנה יומית", text: text, url: url}); return; }
      await navigator.clipboard.writeText(text + "\n" + url);
      b.textContent = "✓ הקישור הועתק";
      setTimeout(() => { b.textContent = "שיתוף"; }, 2200);
    } catch (e) {}
  });
}

/* ================= ניווט בכתובת =================
   כל מסך מקבל כתובת משלו, כדי שכפתור "אחורה" יעבוד ושאפשר לשתף קישור. */

let lastHash = null;
function setHash(h){
  lastHash = h;
  if (location.hash !== h) location.hash = h;
}
window.addEventListener("hashchange", () => {
  if (location.hash !== lastHash) route();
});

function route(){
  const parts = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
  const num = i => parseInt(parts[i], 10);
  const sed = i => SEDARIM[num(i)];
  const mas = (i, j) => (sed(i) || {m:[]}).m[num(j)];
  try {
    if (!parts.length) return viewToday();
    if (parts[0] === "all") return viewSedarim();
    if (parts[0] === "settings") return viewSettings();
    if (parts[0] === "my" && Number.isInteger(num(1))){
      /* קישור אישי: #/my/<הקדמה> או #/my/<הקדמה>/<שעה>.
         קובע את ההעדפות פעם אחת במכשיר הזה, ופותח את השיעור. */
      const patch = {offset: Math.max(-OFFSET_MAX, Math.min(OFFSET_MAX, num(1)))};
      const h = num(2);
      if (Number.isInteger(h) && h >= 0 && h <= 23) patch.rollover = h;
      setPrefs(patch);
      return viewToday();
    }
    if (parts[0] === "today") return viewToday();
    if (parts[0] === "d" && Number.isInteger(num(1))) return viewDay(num(1));
    if (parts[0] === "s" && sed(1)) return viewSeder(num(1));
    if (parts[0] === "m" && mas(1, 2)) return viewMasechet(num(1), num(2));
    if (parts[0] === "c" && mas(1, 2) && mas(1, 2).ch[num(3) - 1])
      return viewChapter(num(1), num(2), num(3));
    if (parts[0] === "l" && mas(1, 2) && num(3) >= 1)
      return viewLesson(num(1), num(2), num(3));
  } catch (e) {}
  viewSedarim();
}

/* היום האחרון שסומן כנלמד במלואו, לצורך חיווי פספוס */
function lastLearnedDay(todayIdx){
  const done = memRead().done || {};
  const key = r => r[0] + "." + r[1] + "." + r[2];
  for (let k = todayIdx - 1; k >= Math.max(0, todayIdx - 120); k--){
    if (DAYS[k].every(r => done[key(r)])) return k;
  }
  return -1;
}
const dayIsDone = idx => {
  const done = memRead().done || {};
  return DAYS[idx].every(r => done[r[0] + "." + r[1] + "." + r[2]]);
};

/* ================= מסך "לימוד היום" ================= */
let dayCursor = null;

function viewDay(idx){ renderDay(idx, "#/d/" + Math.min(Math.max(idx,0), DAYS.length-1)); }

function renderDay(idx, hash){
  dayCursor = Math.min(Math.max(idx, 0), DAYS.length - 1);
  setHash(hash);
  const today = currentDayIndex();
  const date = dateOfDay(dayCursor);
  const refs = DAYS[dayCursor];
  refs.forEach(r => remember(r[0], r[1], r[2]));

  setCrumbs([{t:"שישה סדרים", go:viewSedarim}, {t:"לימוד היום"}]);

  const isToday = dayCursor === today;
  const now = new Date();
  const today0 = midnight(now);
  const resting = isToday && !prefs().offset && !isLearnDay(today0);
  const restName = today0.getDay() === 6 ? "שבת שלום" : "חג שמח";
  const dstr = "יום " + DAYNAMES[date.getDay()] + ", " +
               date.getDate() + "." + (date.getMonth() + 1) + "." + date.getFullYear();

  app.innerHTML = '<div class="panel">' +
    '<div class="daynav">' +
      '<button id="prev"' + (dayCursor <= 0 ? " disabled" : "") + '>&rsaquo; הקודם</button>' +
      '<div class="lbl">' + (isToday ? "לימוד היום" : dstr) +
        "<small>" + (isToday ? dstr + " · " : "") +
        "יום " + (dayCursor + 1) + " מתוך " + DAYS.length +
        (isToday ? offsetLabel() : "") + "</small></div>" +
      '<button id="next"' + (dayCursor >= DAYS.length - 1 ? " disabled" : "") + '>הבא &lsaquo;</button>' +
    "</div>" +
    (resting ? '<div class="note">' + restName + '. היום לא לומדים - להלן השיעור הבא.</div>' : "") +
    (isToday && dayIsDone(dayCursor) ? '<div class="doneday">✓ סיימת את השיעור של היום</div>' : "") +
    catchupHTML(isToday, dayCursor) +
    (refs.length > 1 ? '<div class="note">היום הזה חוצה מסכת: שלוש המשניות מתחלקות בין שתי מסכתות, ולכן שני סרטונים.</div>' : "") +
    refs.map(r => playerBlock(r[0], r[1], r[2])).join("") +
    '<div class="acts">' +
      (isToday ? "" : '<button class="act" id="back2today">חזרה ללימוד היום</button>') +
      '<button class="act" id="allsedarim">כל הסדרים</button>' +
      '<button class="act" id="opensettings">הגדרות</button>' +
    "</div>" +
  "</div>";

  const prev = document.getElementById("prev"), next = document.getElementById("next");
  if (prev) prev.onclick = () => viewDay(dayCursor - 1);
  if (next) next.onclick = () => viewDay(dayCursor + 1);
  const b2t = document.getElementById("back2today");
  if (b2t) b2t.onclick = () => viewDay(today);
  const cu = document.getElementById("catchup");
  if (cu) cu.onclick = () => viewDay(+cu.dataset.i);
  const als = document.getElementById("allsedarim");
  if (als) als.onclick = viewSedarim;
  const st = document.getElementById("opensettings");
  if (st) st.onclick = viewSettings;
  wirePlayers();
}

function offsetLabel(){
  const o = prefs().offset;
  if (!o) return "";
  const n = Math.abs(o);
  return " · " + (o > 0 ? "מקדים" : "מאחר") + " ב-" + n + " " +
         (n === 1 ? "יום" : "ימים");
}

function catchupHTML(isToday, idx){
  if (!isToday) return "";
  const last = lastLearnedDay(idx);
  if (last < 0 || idx - last <= 1) return "";
  const n = idx - last - 1;
  return '<div class="catchup">פספסת ' + n + ' ' + (n === 1 ? 'שיעור' : 'שיעורים') +
         '. אפשר להשלים מהמקום שעצרת.' +
         '<button id="catchup" data-i="' + (last + 1) + '">להשלמה</button></div>';
}

const viewToday = () => renderDay(currentDayIndex(), "#/today");

    '</div></div>';

  const rv = document.getElementById("rv"), off = document.getElementById("off");
  const myUrl = () => location.origin + location.pathname +
        "#/my/" + prefs().offset + "/" + prefs().rollover;
  const draw = () => {
    document.getElementById("mylink").textContent = myUrl();
    const i = currentDayIndex();
    const refs = DAYS[i].map(r => SEDARIM[r[0]].m[r[1]].n + " " + r[2]).join(" + ");
    const d = dateOfDay(i);
    document.getElementById("pv").innerHTML =
      "<strong>כרגע יוצא:</strong> " + refs +
      "<br><span>" + "יום " + DAYNAMES[d.getDay()] + ", " +
      d.getDate() + "." + (d.getMonth() + 1) + "." + d.getFullYear() +
      " · יום " + (i + 1) + " מתוך " + DAYS.length + offsetLabel() + "</span>";
  };
  const clamp = v => Math.max(-OFFSET_MAX, Math.min(OFFSET_MAX, v || 0));
  rv.onchange = () => { setPrefs({rollover: +rv.value}); draw(); };
  off.oninput = () => { setPrefs({offset: clamp(parseInt(off.value, 10))}); draw(); };
  document.getElementById("minus").onclick = () => {
    off.value = clamp(parseInt(off.value, 10) - 1); off.oninput(); };
  document.getElementById("plus").onclick = () => {
    off.value = clamp(parseInt(off.value, 10) + 1); off.oninput(); };
  document.getElementById("reset").onclick = () => {
    setPrefs({rollover: ROLLOVER_DEFAULT, offset: 0});
    rv.value = ROLLOVER_DEFAULT; off.value = 0; draw(); };
  document.getElementById("tolesson").onclick = viewToday;
  document.getElementById("copylink").onclick = async (e) => {
    try {
      if (navigator.share) { await navigator.share({title: "משנה יומית", url: myUrl()}); return; }
      await navigator.clipboard.writeText(myUrl());
      e.target.textContent = "✓ הועתק";
      setTimeout(() => { e.target.textContent = "העתקה"; }, 2200);
    } catch (err) {}
  };
  draw();
}

/* ================= מסך שיעור בודד ================= */
function viewLesson(si, mi, L){
  const s = SEDARIM[si], m = s.m[mi];
  setHash("#/l/" + si + "/" + mi + "/" + L);
  setCrumbs([{t:"שישה סדרים", go:viewSedarim},
             {t:"סדר " + s.n, go:() => viewSeder(si)},
             {t:m.n, go:() => viewMasechet(si, mi)},
             {t:"שיעור " + L}]);
  remember(si, mi, L);
  const last = Math.max((m.v || []).length, (m.a || []).length);
  app.innerHTML = '<div class="panel">' +
    '<div class="daynav">' +
      '<button id="lprev"' + (L <= 1 ? " disabled" : "") + '>&rsaquo; הקודם</button>' +
      '<div class="lbl">שיעור ' + L + '<small>מתוך ' + last + ' במסכת ' + m.n + '</small></div>' +
      '<button id="lnext"' + (L >= last ? " disabled" : "") + '>הבא &lsaquo;</button>' +
    "</div>" + playerBlock(si, mi, L) + "</div>";
  const pv = document.getElementById("lprev"), nx = document.getElementById("lnext");
  if (pv) pv.onclick = () => viewLesson(si, mi, L - 1);
  if (nx) nx.onclick = () => viewLesson(si, mi, L + 1);
  wirePlayers();
}

function setCrumbs(parts){
  crumbs.innerHTML = parts.map((p,i)=>
    p.go ? `<a data-i="${i}">${p.t}</a>` : `<span>${p.t}</span>`).join(' <span>›</span> ');
  crumbs.querySelectorAll("a").forEach(a => a.onclick = () => parts[+a.dataset.i].go());
}

function heroHTML(){
  const last = memRead().last;
  let resume = "";
  const todayRefs = (DAYS[currentDayIndex()] || [])
        .map(r => r[0] + "." + r[1] + "." + r[2]);
  const isToday = last && todayRefs.indexOf(last.si + "." + last.mi + "." + last.l) >= 0;
  if (last && !isToday && SEDARIM[last.si] && SEDARIM[last.si].m[last.mi]){
    const m = SEDARIM[last.si].m[last.mi];
    resume = `<a class="btn ghost" id="resume">המשך: ${m.n} שיעור ${last.l}</a>`;
  }
  return `<div class="hero"><a class="btn" id="gotoday">לימוד היום</a>${resume}</div>`;
}

function wireHero(){
  const t = document.getElementById("gotoday");
  if (t) t.onclick = viewToday;
  const r = document.getElementById("resume");
  if (r) r.onclick = () => { const l = memRead().last; viewLesson(l.si, l.mi, l.l); };
}

function viewSedarim(){
  setHash("#/all");
  setCrumbs([{t:"שישה סדרים"}]);
  app.innerHTML = heroHTML() + `<div class="grid">${SEDARIM.map((s,i)=>{
    const done = s.m.filter(m=>m.p).length;
    return `<div class="tile" data-s="${i}">
      <h3>סדר ${s.n}</h3>
      <div class="sub">${s.m.length} מסכתות</div>
      <span class="badge">${done ? done + " עם שיעורים" : "טרם הועלה"}</span>
    </div>`;
  }).join("")}</div>`;
  app.querySelectorAll(".tile[data-s]").forEach(t => t.onclick = () => viewSeder(+t.dataset.s));
  wireHero();
}

function viewSeder(si){
  const s = SEDARIM[si];
  setHash("#/s/" + si);
  setCrumbs([{t:"שישה סדרים", go:viewSedarim},{t:"סדר "+s.n}]);
  app.innerHTML = `<div class="grid">${s.m.map((m,i)=>{
    const nAud = (m.a||[]).filter(Boolean).length;
    if (!m.p && !nAud) return `<div class="tile off"><h3>${m.n}</h3><div class="sub">טרם הוקלט</div></div>`;
    const have = m.p ? (m.v||[]).filter(Boolean).length : nAud;
    const miss = (m.p ? (m.v||[]).length : (m.a||[]).length) - have;
    return `<div class="tile" data-m="${i}">
      <h3>${m.n}</h3>
      <div class="sub">${m.ch.length} פרקים · ${total(m)} משניות</div>
      ${miss ? `<span class="badge">${have} מתוך ${have+miss} שיעורים</span>` : ''}
      ${m.u ? '<span class="badge">פלייליסט בלבד</span>' : ''}
      ${!m.p && nAud ? '<span class="badge">הקלטות אודיו</span>' : ''}
    </div>`;
  }).join("")}</div>`;
  app.querySelectorAll(".tile[data-m]").forEach(t => t.onclick = () => viewMasechet(si, +t.dataset.m));
}

function viewMasechet(si, mi){
  const s = SEDARIM[si], m = s.m[mi];
  setHash("#/m/" + si + "/" + mi);
  setCrumbs([{t:"שישה סדרים", go:viewSedarim},
             {t:"סדר "+s.n, go:()=>viewSeder(si)},
             {t:m.n}]);
  const chapters = m.u ? '' : `<div class="sec">
      <h4>בחר פרק</h4>
      <div class="chips">${m.ch.map((n,i)=>
        `<div class="chip" data-c="${i+1}">${heb(i+1)}<small>${n} משניות</small></div>`).join("")}</div>
    </div>`;
  app.innerHTML = `<div class="panel">
    <h2>מסכת ${m.n}</h2>
    <div class="meta">סדר ${s.n} · ${m.ch.length} פרקים · ${total(m)} משניות</div>
    ${(() => { const n = lessonCount(m); if (!n) return "";
       let d = 0; for (let L = 1; L <= n; L++) if (isSeen(si, mi, L)) d++;
       return `<div class="prog"><i style="width:${Math.round(100*d/n)}%"></i></div>
         <div class="meta">למדת ${d} מתוך ${n} שיעורים</div>`; })()}
    ${m.p ? `<a class="btn" href="https://www.youtube.com/playlist?list=${m.p}" target="_blank" rel="noopener">▶ הפעל את הפלייליסט</a>` : ''}
    ${m.x ? `<a class="btn" style="margin-inline-start:10px;background:transparent;
       color:var(--accent);border:1px solid var(--accent)"
       href="https://www.youtube.com/watch?v=${m.x[1]}&list=${m.p}"
       target="_blank" rel="noopener">${m.x[0]}</a>` : ''}
    ${!m.p && (m.a||[]).some(Boolean) ? `<div class="note">המסכת הזו עדיין לא עלתה ליוטיוב.
       השיעורים כאן הם הקלטות האודיו המקוריות, ומתנגנים ישירות בדף.</div>` : ''}
    ${m.u ? `<div class="note">כאן עוד לא מיפינו משניות לסרטונים. ${m.u}.</div>` : ''}
    ${chapters}
    ${m.xa ? `<div class="sec"><h4>${m.xa[0]}</h4>
       <div class="audio"><iframe src="https://drive.google.com/file/d/${m.xa[1]}/preview"
         title="${m.xa[0]}" loading="lazy" allow="autoplay"></iframe></div></div>` : ''}
  </div>`;
  app.querySelectorAll(".chip[data-c]").forEach(c =>
    c.onclick = () => viewChapter(si, mi, +c.dataset.c));
}

function viewChapter(si, mi, c){
  const s = SEDARIM[si], m = s.m[mi], n = m.ch[c-1];
  setHash("#/c/" + si + "/" + mi + "/" + c);
  setCrumbs([{t:"שישה סדרים", go:viewSedarim},
             {t:"סדר "+s.n, go:()=>viewSeder(si)},
             {t:m.n, go:()=>viewMasechet(si, mi)},
             {t:"פרק "+heb(c)}]);

  const chips = [];
  for (let i = 1; i <= n; i++){
    const vi  = videoOf(m, flatIndex(m, c, i));
    const vid = (m.v||[])[vi-1] || (m.a||[])[vi-1];
    const seen = isSeen(si, mi, vi);
    chips.push(vid
      ? `<div class="chip${seen ? " seen" : ""}" data-l="${vi}">${heb(i)}<small>${
           seen ? '<span class="tick">✓</span> ' : ""}שיעור ${vi}</small></div>`
      : `<div class="chip dead" title="השיעור עדיין לא הוקלט">${heb(i)}<small>—</small></div>`);
  }
  app.innerHTML = `<div class="panel">
    <h2>${m.n} · פרק ${heb(c)}</h2>
    <div class="meta">${n} משניות · לחיצה על משנה פותחת כאן את השיעור שבו היא נלמדת</div>
    <div class="chips">${chips.join("")}</div>
    <div class="sec"><h4>שים לב</h4>
      כל שיעור מכיל שלוש משניות ברצף, ולכן שיעור אחד יכול לחצות בין פרקים.
      משניות שונות עשויות להוביל לאותו שיעור.</div>
  </div>`;
  app.querySelectorAll(".chip[data-l]").forEach(ch =>
    ch.onclick = () => viewLesson(si, mi, +ch.dataset.l));
}

document.getElementById("memnote").textContent =
  "המקום שלך והשיעורים שסימנת נשמרים במכשיר הזה בלבד";
applyFont();
document.getElementById("sf").onsubmit = e => { e.preventDefault();
  doSearch(document.getElementById("q").value); document.getElementById("q").blur(); };
route();
</script>
